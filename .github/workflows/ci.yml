name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      # The real scikit-learn tests are gated on ML_TEST_PYTHON locally; CI must always provide it
      # (tests/unit/ml-artifact-compat.test.ts fails the job if it is missing). Python is a verification
      # dependency only: ML stays disabled by default at runtime.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements.txt }
      - name: Install pinned ML requirements
        run: |
          python -m venv "$RUNNER_TEMP/ml-venv"
          "$RUNNER_TEMP/ml-venv/bin/python" -m pip install -r ml/requirements.txt
          echo "ML_TEST_PYTHON=$RUNNER_TEMP/ml-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --json --ignore-scripts
      - run: docker build -t durable-agent-platform:ci .
      - name: Scan working tree and reachable history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --no-banner --redact
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
