name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      # The real scikit-learn backend tests are gated on ML_TEST_PYTHON locally; CI must always provide it
      # (tests/unit/ml-artifact-compat.test.ts and ml-pytorch-runner.test.ts fail the job if it is missing). Python is a verification
      # dependency only: ML stays disabled by default at runtime.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements-pytorch.txt }
      # One verification venv serves both the sklearn and the CPU PyTorch backends. torch comes from the CPU wheel
      # index (no CUDA download), and it is installed before the pinned requirements, which then see it satisfied.
      - name: Install pinned ML requirements (scikit-learn and CPU PyTorch)
        run: |
          python -m venv "$RUNNER_TEMP/ml-venv"
          "$RUNNER_TEMP/ml-venv/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          "$RUNNER_TEMP/ml-venv/bin/python" -m pip install -r ml/requirements-pytorch.txt
          echo "ML_TEST_PYTHON=$RUNNER_TEMP/ml-venv/bin/python" >> "$GITHUB_ENV"
          echo "ML_TEST_PYTORCH_PYTHON=$RUNNER_TEMP/ml-venv/bin/python" >> "$GITHUB_ENV"
          echo "ML_TEST_AUDIO_PYTHON=$RUNNER_TEMP/ml-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --json --ignore-scripts
      - run: docker build -t durable-agent-platform:ci .
      - name: Scan working tree and reachable history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --no-banner --redact
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

  # Separate from `test`: TensorFlow is optional at runtime and heavy to install. This job runs the real TensorFlow runner,
  # its catalog and its durable lifecycle. The `test` job skips those tests, because ML_TEST_TENSORFLOW_PYTHON is not set there.
  tensorflow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      ML_TENSORFLOW_JOB: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements-tensorflow.txt }
      # CPU-only TensorFlow with its pinned requirements. The shared ML packages come from ml/requirements.txt, so this venv matches the others.
      - name: Install pinned TensorFlow requirements (CPU only)
        run: |
          python -m venv "$RUNNER_TEMP/tf-venv"
          "$RUNNER_TEMP/tf-venv/bin/python" -m pip install -r ml/requirements-tensorflow.txt
          echo "ML_TEST_TENSORFLOW_PYTHON=$RUNNER_TEMP/tf-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run tests/unit/ml-tensorflow.test.ts tests/unit/ml-tensorflow-runner.test.ts tests/integration/ml-tensorflow.test.ts tests/conformance/tensorflow.test.ts
        env:
          CI: "true"

  # Separate from `test`: JAX is optional at runtime. This job runs the real JAX runner (CPU jaxlib only), its catalog, its
  # conformance file and its durable lifecycle. The `test` job skips those tests, because ML_TEST_JAX_PYTHON is not set there.
  jax:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      ML_JAX_JOB: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements-jax.txt }
      - name: Install pinned JAX requirements (CPU only)
        run: |
          python -m venv "$RUNNER_TEMP/jax-venv"
          "$RUNNER_TEMP/jax-venv/bin/python" -m pip install -r ml/requirements-jax.txt
          echo "ML_TEST_JAX_PYTHON=$RUNNER_TEMP/jax-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run tests/unit/ml-jax.test.ts tests/unit/ml-jax-runner.test.ts tests/integration/ml-jax.test.ts tests/conformance/jax.test.ts
        env:
          CI: "true"

  # Separate from `test`: XGBoost and LightGBM are optional at runtime. One venv hosts both (ml/requirements-gbdt.txt).
  # This job runs both real runners, their catalogs, their conformance files and their lifecycle through the processor,
  # including a benchmark against scikit-learn (so the venv's scikit-learn serves as ML_TEST_PYTHON too).
  gbdt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      ML_GBDT_JOB: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements-gbdt.txt }
      - name: Install pinned XGBoost and LightGBM requirements (CPU only)
        run: |
          python -m venv "$RUNNER_TEMP/gbdt-venv"
          "$RUNNER_TEMP/gbdt-venv/bin/python" -m pip install -r ml/requirements-gbdt.txt
          echo "ML_TEST_XGBOOST_PYTHON=$RUNNER_TEMP/gbdt-venv/bin/python" >> "$GITHUB_ENV"
          echo "ML_TEST_LIGHTGBM_PYTHON=$RUNNER_TEMP/gbdt-venv/bin/python" >> "$GITHUB_ENV"
          echo "ML_TEST_PYTHON=$RUNNER_TEMP/gbdt-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run tests/unit/ml-gbdt.test.ts tests/unit/ml-gbdt-runner.test.ts tests/integration/ml-gbdt.test.ts tests/conformance/xgboost.test.ts tests/conformance/lightgbm.test.ts tests/conformance/lightgbm-forecaster.test.ts tests/integration/ml-forecasting.test.ts
        env:
          CI: "true"

  # Separate from `test`: Transformers is optional at runtime and heavy to install. This job runs the real runner over tiny
  # fixtures generated offline at test time (tests/python/hf_fixtures.py): no model is downloaded. CPU torch only.
  transformers:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform
      ML_TRANSFORMERS_JOB: "true"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ml/requirements-transformers.txt }
      - name: Install pinned transformers requirements (CPU torch first)
        run: |
          python -m venv "$RUNNER_TEMP/hf-venv"
          "$RUNNER_TEMP/hf-venv/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          "$RUNNER_TEMP/hf-venv/bin/python" -m pip install -r ml/requirements-transformers.txt
          echo "ML_TEST_TRANSFORMERS_PYTHON=$RUNNER_TEMP/hf-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run tests/unit/ml-transformers.test.ts tests/unit/ml-transformers-runner.test.ts tests/integration/ml-transformers.test.ts tests/conformance/transformers-text-classifier.test.ts tests/conformance/transformers-text-embedder.test.ts tests/conformance/transformers-text-embedding-classifier.test.ts tests/conformance/transformers-image-classifier.test.ts tests/conformance/transformers-image-embedder.test.ts tests/conformance/transformers-image-embedding-classifier.test.ts
        env:
          CI: "true"
